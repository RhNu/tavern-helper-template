name: bundle

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - dist/**
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.S3_REGION || vars.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT || vars.S3_ENDPOINT }}
      S3_PREFIX: ${{ secrets.S3_PREFIX || vars.S3_PREFIX }}
      S3_UPLOAD_ENABLED:
        ${{ (secrets.S3_BUCKET || vars.S3_BUCKET) != '' && secrets.S3_ACCESS_KEY_ID != '' &&
        secrets.S3_SECRET_ACCESS_KEY != '' && (secrets.S3_REGION || vars.S3_REGION) != '' &&
        (secrets.S3_PREFIX || vars.S3_PREFIX) != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: JesseTG/rm@v1.0.3
        with:
          path: dist
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - run: pnpm install --frozen-lockfile && pnpm check && pnpm build

      - name: Commit changes
        uses: EndBug/add-and-commit@v9.1.3
        with:
          default_author: github_actions
          message: 'build(dist): bundle artifacts'

      - name: Upload scripts to S3-compatible object storage
        if: ${{ env.S3_UPLOAD_ENABLED == 'true' }}
        shell: bash
        run: |
          prefix="${S3_PREFIX#/}"
          prefix="${prefix%/}"
          endpoint_args=()
          if [[ -n "${S3_ENDPOINT}" ]]; then
            endpoint_args+=(--endpoint-url "${S3_ENDPOINT}")
          fi
          aws s3 sync dist/scripts "s3://${S3_BUCKET}/${prefix}/" --delete "${endpoint_args[@]}"

      - name: Skip object storage upload
        if: ${{ env.S3_UPLOAD_ENABLED != 'true' }}
        run: echo "Object storage upload skipped because required secrets or variables are not configured."

      # 自动打版本 tag, 从而让 jsdelivr 基于版本号在 12h 内更新缓存而不是用非版本号的 7d 缓存
      - id: autotag
        if: github.repository != 'RhNu/tavern-helper-template'
        uses: phish108/autotag-action@v1.1.64
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          with-v: true
      - if:
          ${{ github.repository != 'RhNu/tavern-helper-template' && steps.autotag.outputs.tag != '0.0.0' &&
          steps.autotag.outputs.new-tag != steps.autotag.outputs.tag }}
        run: git push --delete origin ${{ steps.autotag.outputs.tag }}
